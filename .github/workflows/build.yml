name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build and sign APK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK/build-tools" "$SDK/platforms"

          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | grep -E '^[0-9.]+$' | sort -V | tail -1)"
          JAR="$SDK/platforms/$(ls "$SDK/platforms" | grep -E '^android-[0-9]+$' | sort -V | tail -1)/android.jar"
          echo "Using BT=$BT"
          echo "Using JAR=$JAR"

          mkdir -p build/classes build/dex out

          echo "== 1. Package manifest"
          "$BT/aapt2" link -o build/base.apk -I "$JAR" \
            --manifest AndroidManifest.xml \
            --min-sdk-version 23 --target-sdk-version 23 \
            --version-code 1 --version-name 1.0

          echo "== 2. Compile Java"
          javac --release 8 -Xlint:-options -cp "$JAR" -d build/classes Launcher.java

          echo "== 3. Convert to Android bytecode"
          "$BT/d8" --release --min-api 23 --lib "$JAR" \
            --output build/dex $(find build/classes -name '*.class')

          echo "== 4. Add code to APK and align"
          (cd build/dex && zip -j ../base.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk

          echo "== 5. Sign"
          keytool -genkeypair -keystore build/debug.keystore \
            -storepass android -keypass android -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Fast Launcher"
          "$BT/apksigner" sign --ks build/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out out/FastLauncher.apk build/aligned.apk
          "$BT/apksigner" verify --verbose out/FastLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FastLauncher-apk
          path: out/FastLauncher.apk
